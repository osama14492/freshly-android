      - name: Extract project ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname 'FRESHLY_ANDROID_UPLOAD*.zip' -print -quit)
          if [ -z "$ZIP_FILE" ]; then
            echo "ZIP file not found"
            ls -la
            exit 1
          fi
          unzip -o "$ZIP_FILE" -d .
          rm "$ZIP_FILE"
