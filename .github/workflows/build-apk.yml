name: Build FRESHLY APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'FRESHLY_ANDROID_UPLOAD-1.zip'
      - '.github/workflows/build-apk.yml'
      - 'cashier.html'
      - 'menu.html'
      - 'orders-expenses.html'
      - 'FRESHLY_SECURE_MainActivity.kt'
      - 'FRESHLY_BACKUP_RESTORE_BLOCK.js'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Extract Android project without overwriting current web sources
        run: |
          mkdir -p /tmp/freshly-current-sources
          cp cashier.html menu.html orders-expenses.html FRESHLY_SECURE_MainActivity.kt FRESHLY_BACKUP_RESTORE_BLOCK.js /tmp/freshly-current-sources/
          unzip -o FRESHLY_ANDROID_UPLOAD-1.zip -d .
          cp /tmp/freshly-current-sources/cashier.html .
          cp /tmp/freshly-current-sources/menu.html .
          cp /tmp/freshly-current-sources/orders-expenses.html .
          cp /tmp/freshly-current-sources/FRESHLY_SECURE_MainActivity.kt .
          cp /tmp/freshly-current-sources/FRESHLY_BACKUP_RESTORE_BLOCK.js .
      - name: Install password and biometric protection
        run: |
          mkdir -p app/src/main/java/com/freshly/premier
          cp FRESHLY_SECURE_MainActivity.kt app/src/main/java/com/freshly/premier/MainActivity.kt
          python3 - <<'PY'
          from pathlib import Path
          import re
          gradle=Path("app/build.gradle")
          s=gradle.read_text()
          if "androidx.biometric:biometric" not in s:
              s=s.replace("dependencies {", "dependencies {\n    implementation 'androidx.biometric:biometric:1.1.0'\n    implementation 'androidx.fragment:fragment-ktx:1.8.5'", 1)
          gradle.write_text(s)
          manifest=Path("app/src/main/AndroidManifest.xml")
          m=manifest.read_text()
          # WebView must have INTERNET permission to load Firebase App/Auth SDKs and reach Firebase Authentication.
          for permission in ("android.permission.INTERNET", "android.permission.ACCESS_NETWORK_STATE", "android.permission.USE_BIOMETRIC", "android.permission.POST_NOTIFICATIONS", "android.permission.VIBRATE"):
              if f'android:name="{permission}"' not in m:
                  m=m.replace("<application", f'<uses-permission android:name="{permission}" />\n    <application', 1)
          m=m.replace('android:allowBackup="true"', 'android:allowBackup="false"')
          manifest.write_text(m)
          print("Password/biometric source, dependencies and manifest installed.")
          PY
      - name: Install native Firebase Cloud Messaging for background order alerts
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          # Add the Google Services Gradle plugin without replacing existing plugins.
          root = Path("build.gradle")
          rs = root.read_text()
          if "com.google.gms.google-services" not in rs:
              rs = rs.replace("plugins {", "plugins {\n    id 'com.google.gms.google-services' version '4.4.2' apply false", 1)
          root.write_text(rs)
          app = Path("app/build.gradle")
          a = app.read_text()
          if "com.google.gms.google-services" not in a:
              a = a.replace("plugins {", "plugins {\n    id 'com.google.gms.google-services'", 1)
          if "firebase-bom" not in a:
              a = a.replace("dependencies {", "dependencies {\n    implementation platform('com.google.firebase:firebase-bom:33.7.0')\n    implementation 'com.google.firebase:firebase-messaging'\n", 1)
          app.write_text(a)
          # Firebase client configuration from the user's existing google-services.json.
          config = {
            "project_info": {"project_number":"92150322225","firebase_url":"https://freshly-pos-default-rtdb.firebaseio.com","project_id":"freshly-pos","storage_bucket":"freshly-pos.firebasestorage.app"},
            "client":[{"client_info":{"mobilesdk_app_id":"1:92150322225:android:ae1bd2020674d0a6863110","android_client_info":{"package_name":"com.freshly.premier"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyCVC0cT8nPvYMeH6mawHJl_AK0IQ6DRRG4"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],
            "configuration_version":"1"
          }
          Path("app/google-services.json").write_text(json.dumps(config, indent=2) + "\n")
          # FCM service: displays high-priority order alerts even when WebView is closed.
          service = r'''package com.freshly.premier
          
          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.content.Context
          import android.os.Build
          import androidx.core.app.NotificationCompat
          import com.google.firebase.messaging.FirebaseMessagingService
          import com.google.firebase.messaging.RemoteMessage
          
          class FRESHLYFirebaseMessagingService : FirebaseMessagingService() {
              override fun onNewToken(token: String) {
                  super.onNewToken(token)
                  getSharedPreferences("freshly_fcm", Context.MODE_PRIVATE).edit().putString("fcm_token", token).apply()
              }
          
              override fun onMessageReceived(message: RemoteMessage) {
                  super.onMessageReceived(message)
                  val title = (message.notification?.title ?: message.data["title"] ?: "طلب جديد").take(80)
                  val body = (message.notification?.body ?: message.data["body"] ?: "لديك طلب جديد على FRESHLY").take(500)
                  val manager = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  val channelId = "freshly_orders"
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O &&
                      manager.getNotificationChannel(channelId) == null) {
                      manager.createNotificationChannel(NotificationChannel(channelId, "إشعارات FRESHLY", NotificationManager.IMPORTANCE_HIGH))
                  }
                  val launch = packageManager.getLaunchIntentForPackage(packageName)
                  val flags = PendingIntent.FLAG_UPDATE_CURRENT or
                      (if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) PendingIntent.FLAG_IMMUTABLE else 0)
                  val pending = launch?.let { PendingIntent.getActivity(this, 7102, it, flags) }
                  val notification = NotificationCompat.Builder(this, channelId)
                      .setSmallIcon(R.mipmap.ic_launcher)
                      .setContentTitle(title)
                      .setContentText(body)
                      .setStyle(NotificationCompat.BigTextStyle().bigText(body))
                      .setPriority(NotificationCompat.PRIORITY_HIGH)
                      .setAutoCancel(true)
                      .apply { if (pending != null) setContentIntent(pending) }
                      .build()
                  manager.notify((message.data["orderId"] ?: System.currentTimeMillis().toString()).hashCode(), notification)
              }
          }
          '''
          target = Path("app/src/main/java/com/freshly/premier/FRESHLYFirebaseMessagingService.kt")
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(service)
          # Extend the existing secure WebView bridge with a guarded asynchronous token getter.
          main = Path("app/src/main/java/com/freshly/premier/MainActivity.kt")
          m = main.read_text()
          if "FirebaseMessaging.getInstance().token" not in m:
              m = m.replace("import android.util.Base64", "import android.util.Base64\nimport com.google.firebase.messaging.FirebaseMessaging\nimport org.json.JSONObject", 1)
              anchor = "        @JavascriptInterface\n        fun areNotificationsEnabled(): Boolean = areFreshlyNotificationsEnabled()"
              addition = anchor + '''
          
                  @JavascriptInterface
                  fun getFcmToken(callbackName: String) {
                      if (!cashierPageActive || !callbackName.matches(Regex("[A-Za-z_$][A-Za-z0-9_$]{0,63}"))) return
                      FirebaseMessaging.getInstance().token.addOnCompleteListener { task ->
                          val value = if (task.isSuccessful) task.result else ""
                          val js = "window[" + JSONObject.quote(callbackName) + "] && window[" +
                              JSONObject.quote(callbackName) + "](" + JSONObject.quote(value ?: "") + ");"
                          webView.post { webView.evaluateJavascript(js, null) }
                      }
                  }
              '''
              if anchor not in m: raise SystemExit("Secure MainActivity bridge insertion point missing")
              m = m.replace(anchor, addition, 1)
              main.write_text(m)
          # Declare FCM service and required Android notification permission.
          manifest = Path("app/src/main/AndroidManifest.xml")
          x = manifest.read_text()
          if 'android.permission.POST_NOTIFICATIONS' not in x:
              x = x.replace("<application", '<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.VIBRATE"/>\n    <application', 1)
          if "FRESHLYFirebaseMessagingService" not in x:
              x = x.replace("</application>", '''        <service
              android:name=".FRESHLYFirebaseMessagingService"
              android:exported="false">
              <intent-filter>
                  <action android:name="com.google.firebase.MESSAGING_EVENT"/>
              </intent-filter>
          </service>
          </application>''', 1)
          manifest.write_text(x)
          # Add a small cashier-only control so the owner can copy this device's FCM token.
          cashier = Path("cashier.html")
          page = cashier.read_text()
          token_ui = r"""
          <style>
            #freshlyFcmTokenBtn{position:fixed;left:12px;bottom:12px;z-index:2147483000;border:1px solid #c9a64b;border-radius:12px;background:#171717;color:#f4d77c;padding:10px 13px;font:600 12px Arial;box-shadow:0 3px 14px #0005}
          </style>
          <button id="freshlyFcmTokenBtn" type="button">نسخ رمز إشعارات الطلبات</button>
          <script>
          (function(){
            const b=document.getElementById('freshlyFcmTokenBtn');
            if(!b || b.dataset.ready) return; b.dataset.ready='1';
            b.addEventListener('click',function(){
              if(!window.FRESHLYNative || !FRESHLYNative.getFcmToken){alert('ميزة الإشعارات غير متاحة في هذا الإصدار.');return;}
              b.disabled=true; b.textContent='جارٍ استخراج الرمز...';
              window.__freshlyReceiveFcmToken=function(token){
                b.disabled=false; b.textContent='نسخ رمز إشعارات الطلبات';
                if(!token){alert('تعذر استخراج رمز الإشعارات. تأكد من اتصال الإنترنت ثم أعد المحاولة.');return;}
                const t=document.createElement('textarea');t.value=token;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();
                let ok=false;try{ok=document.execCommand('copy')}catch(e){}
                t.remove();
                if(ok){alert('تم نسخ رمز الجهاز. ضعه في Cloudflare Secret باسم FCM_DEVICE_TOKEN.');}
                else{prompt('انسخ رمز الجهاز وضعه في Cloudflare Secret باسم FCM_DEVICE_TOKEN:',token);}
              };
              FRESHLYNative.getFcmToken('__freshlyReceiveFcmToken');
            });
          })();
          </script>
          """
          if "freshlyFcmTokenBtn" not in page:
              if "</body>" not in page: raise SystemExit("Cashier page closing body tag not found; cannot safely add token control.")
              page = page.replace("</body>", token_ui + "\\n</body>", 1)
              cashier.write_text(page)
          print("Installed FCM SDK, token bridge, background notification service, and cashier token-copy control.")
          PY
          echo '--- FCM files ---'
          grep -n "firebase-messaging\\|google-services" app/build.gradle build.gradle
          grep -n "FRESHLYFirebaseMessagingService\\|POST_NOTIFICATIONS" app/src/main/AndroidManifest.xml
          grep -n "getFcmToken" app/src/main/java/com/freshly/premier/MainActivity.kt
      - name: Use current POS and menu source files
        run: |
          test -f app/src/main/assets/home.html
          test -f app/src/main/assets/freshly-logo.png
          # Upgrade only the backup/restore handlers while preserving the current cashier UI and all current business logic.
          python3 - <<'PY'
          from pathlib import Path
          p=Path("cashier.html")
          s=p.read_text()
          start=s.index("  document.getElementById('exportBackupBtn').addEventListener('click',()=>{")
          end=s.index("  let pendingReminderTimer=null;", start)
          block=Path("FRESHLY_BACKUP_RESTORE_BLOCK.js").read_text()
          p.write_text(s[:start] + block + "\n" + s[end:])
          print("Installed complete validated local backup/restore handlers.")
          PY
          cp cashier.html app/src/main/assets/cashier.html
          cp menu.html app/src/main/assets/menu.html
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/assets/offline-bridge.js')
          s = p.read_text()
          old = "      database(){ return {ref:makeRef}; }"
          new = "      auth(...args){ if (!realFirebase || typeof realFirebase.auth !== 'function') throw new Error('Firebase Authentication SDK is not loaded'); return realFirebase.auth(...args); },\n      database(){ return {ref:makeRef}; }"
          if old not in s:
              raise SystemExit('Firebase offline bridge facade signature not found')
          s = s.replace(old, new, 1)
          old_init = " } return realApp; },"
          new_init = " } if (realApp) { listeners.forEach(attachRemote); flushQueue(); } return realApp; },"
          if old_init not in s:
              raise SystemExit('Firebase initializeApp bridge code not found')
          s = s.replace(old_init, new_init, 1)
          old_gate = "    if (realFirebase && realApp) { listeners.forEach(attachRemote); flushQueue(); return; }\n"
          new_gate = old_gate + "    if (realFirebase && typeof realFirebase.auth === 'function' && typeof realFirebase.database === 'function') return;\n"
          if old_gate not in s:
              raise SystemExit('Firebase load gate not found')
          s = s.replace(old_gate, new_gate, 1)
          database_load = "      await new Promise((resolve,reject)=>{ const s=document.createElement('script'); s.src='https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js'; s.onload=resolve; s.onerror=reject; document.head.appendChild(s); });"
          auth_load = "      await new Promise((resolve,reject)=>{ const s=document.createElement('script'); s.src='https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js'; s.onload=resolve; s.onerror=reject; document.head.appendChild(s); });\n" + database_load
          if database_load not in s:
              raise SystemExit('Firebase database SDK loader not found')
          s = s.replace(database_load, auth_load, 1)
          p.write_text(s)
          for token in ('auth(...args)', 'firebase-auth-compat.js', 'listeners.forEach(attachRemote)'):
              if token not in s:
                  raise SystemExit('Firebase Auth bridge validation failed: ' + token)
          print('Fixed Firebase offline bridge: auth is preserved and reloading keeps App/Auth/Database together.')
          PY
          node --check app/src/main/assets/offline-bridge.js
          
          # Restore the original, item-matched FRESHLY menu photos from the menu repository.
          git clone --depth 1 https://github.com/osama14492/FRESHLY-MENU-.git /tmp/freshly-menu
          mkdir -p app/src/main/assets/images
          cp /tmp/freshly-menu/images/*.webp app/src/main/assets/images/
          # Recover the original product JPGs deleted from the public menu repo.
          git -C /tmp/freshly-menu fetch --depth 1 origin 3368c4cb6c11cd840d3dbd44420a804fdee93aed
          mkdir -p /tmp/freshly-menu-legacy
          git -C /tmp/freshly-menu archive FETCH_HEAD | tar -x -C /tmp/freshly-menu-legacy
          cp /tmp/freshly-menu-legacy/*.jpg app/src/main/assets/images/
          # Verify every built-in menu item points to an image packaged in this APK.
          python3 - <<'PY'
          import json
          from pathlib import Path
          source = Path("app/src/main/assets/menu.html").read_text()
          marker = "const INITIAL_MENU_DATA = "
          start = source.index(marker) + len(marker)
          end = source.index(";\n", start)
          data = json.loads(source[start:end])
          missing = [item["image"] for item in data["items"]
                     if item.get("image", "").startswith("images/")
                     and not (Path("app/src/main/assets") / item["image"]).is_file()]
          if missing:
              raise SystemExit("Missing original menu images: " + ", ".join(missing))
          print(f"Verified {len(data['items'])} menu items; all local image paths exist.")
          PY
          cp app/src/main/assets/freshly-logo.png app/src/main/assets/images/freshly_logo.png
          # Install the FRESHLY logo as the Android launcher icon as well as the in-app brand.
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "app/src/main/res/mipmap-$density"
            cp app/src/main/assets/freshly-logo.png "app/src/main/res/mipmap-$density/ic_launcher.png"
          done
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          manifests = list(Path("app/src/main").rglob("AndroidManifest.xml"))
          if not manifests:
              raise SystemExit("AndroidManifest.xml not found")
          path = manifests[0]
          tree = ET.parse(path)
          root = tree.getroot()
          ns = "{http://schemas.android.com/apk/res/android}"
          app = root.find("application")
          if app is None:
              raise SystemExit("Android application element not found")
          app.set(ns + "icon", "@mipmap/ic_launcher")
          app.set(ns + "roundIcon", "@mipmap/ic_launcher")
          ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
          tree.write(path, encoding="utf-8", xml_declaration=True)
          print("Configured FRESHLY launcher icon:", path)
          PY
          echo '--- packaged web assets ---'
          ls -lah app/src/main/assets
          ls -lah app/src/main/assets/images
      - name: Bundle Firebase compat SDKs locally for Android WebView
        run: |
          set -euo pipefail
          cd app/src/main/assets
          curl --fail --location --retry 3 --retry-all-errors https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js -o firebase-app-compat.js
          curl --fail --location --retry 3 --retry-all-errors https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js -o firebase-auth-compat.js
          curl --fail --location --retry 3 --retry-all-errors https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js -o firebase-database-compat.js
          cd -
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/assets/cashier.html")
          s = p.read_text()
          replacements = {
              "https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js": "firebase-app-compat.js",
              "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js": "firebase-auth-compat.js",
              "https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js": "firebase-database-compat.js",
              "const base = 'https://www.gstatic.com/firebasejs/9.22.0/';": "const base = './';"
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit("Expected Firebase reference not found: " + old)
              s = s.replace(old, new)
          p.write_text(s)
          for name in ("firebase-app-compat.js", "firebase-auth-compat.js", "firebase-database-compat.js"):
              path = Path("app/src/main/assets") / name
              if not path.is_file() or path.stat().st_size < 10000:
                  raise SystemExit("Firebase SDK asset missing or unexpectedly small: " + name)
          print("Bundled Firebase App/Auth/Database compat SDKs into the APK assets.")
          PY
      - name: Install independent orders and expenses page in the app
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          cp orders-expenses.html app/src/main/assets/orders-expenses.html
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/assets/home.html")
          s = p.read_text()
          marker = "<!-- FRESHLY_ORDERS_EXPENSES_ENTRY -->"
          if marker not in s:
              if "</nav>" not in s or "</head>" not in s:
                  raise SystemExit("Home navigation or head section not found; refusing to alter the home screen.")
              styles = """
          <style>
            .actions{display:flex!important;flex-direction:column!important;align-items:stretch!important;gap:14px!important}
            .actions .action{display:flex!important;width:100%!important;height:88px!important;min-height:88px!important;max-width:none!important;align-items:center!important;overflow:hidden!important}.actions .action small{display:-webkit-box!important;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
            #freshlyOrdersExpensesEntry:active{transform:scale(.985)}
          </style>
          """
              entry = '''
          <!-- FRESHLY_ORDERS_EXPENSES_ENTRY -->
          <a class="action" id="freshlyOrdersExpensesEntry" href="orders-expenses.html"><span class="ico">🧾</span><span><b>الطلبية والمصروفات الشخصية</b><small>المشتريات ونواقص الخامات والمصروفات والتقارير</small></span></a>
          '''
              s = s.replace("</head>", styles + "\n</head>", 1)
              s = s.replace("</nav>", entry + "\n</nav>", 1)
              p.write_text(s)
          home = p.read_text()
          if home.count('class="action"') != 3 or "freshlyOrdersExpensesEntry" not in home:
              raise SystemExit("Home screen must contain exactly three equal action buttons.")
          if "orders-expenses.html" not in home:
              raise SystemExit("Orders and expenses page link is missing.")
          page = Path("app/src/main/assets/orders-expenses.html")
          if not page.is_file() or page.stat().st_size < 10000:
              raise SystemExit("Orders and expenses page is missing or incomplete.")
          print("Installed the standalone orders and expenses page and its home-screen entry.")
          PY
      - name: Validate cashier JavaScript syntax
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path('cashier.html').read_text()
          scripts = re.findall(r'<script\b([^>]*)>(.*?)</script\s*>', html, flags=re.I | re.S)
          inline = [body for attrs, body in scripts if not re.search(r'\bsrc\s*=', attrs, flags=re.I) and body.strip()]
          if not inline:
              raise SystemExit('No inline cashier JavaScript blocks found')
          for index, body in enumerate(inline, 1):
              Path(f'/tmp/freshly-cashier-{index}.js').write_text(body)
          print(f'Extracted {len(inline)} inline cashier JavaScript blocks for syntax validation.')
          PY
          for source in /tmp/freshly-cashier-*.js; do node --check "$source"; done
      - name: Validate orders and expenses JavaScript syntax
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path('orders-expenses.html').read_text()
          scripts = re.findall(r'<script\b([^>]*)>(.*?)</script\s*>', html, flags=re.I | re.S)
          inline = [body for attrs, body in scripts if not re.search(r'\bsrc\s*=', attrs, flags=re.I) and body.strip()]
          if len(inline) != 1:
              raise SystemExit(f'Expected one inline page script, found {len(inline)}')
          Path('/tmp/freshly-orders-expenses.js').write_text(inline[0])
          PY
          node --check /tmp/freshly-orders-expenses.js
      - name: Align Java and Kotlin JVM targets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle")
          s = p.read_text()
          needle = "android {"
          addition = """android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          """
          if needle not in s:
              raise SystemExit("android block not found in app/build.gradle")
          s = s.replace(needle, addition, 1)
          p.write_text(s)
          PY
          echo '--- patched app/build.gradle ---'
          cat app/build.gradle
      - name: Inspect Android project
        run: |
          pwd
          ls -la
          find app -maxdepth 4 -type f | sort
          echo '--- settings.gradle ---'
          cat settings.gradle
          echo '--- root build.gradle ---'
          cat build.gradle
          echo '--- app/build.gradle ---'
          cat app/build.gradle
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          dependency-graph: disabled
      - name: Configure permanent FRESHLY signing key
        env:
          FRESHLY_KEYSTORE_BASE64: ${{ secrets.FRESHLY_KEYSTORE_BASE64 }}
          FRESHLY_KEYSTORE_PASSWORD: ${{ secrets.FRESHLY_KEYSTORE_PASSWORD }}
          FRESHLY_KEY_ALIAS: ${{ secrets.FRESHLY_KEY_ALIAS }}
          FRESHLY_KEY_PASSWORD: ${{ secrets.FRESHLY_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$FRESHLY_KEYSTORE_BASE64" || { echo "Missing GitHub secret: FRESHLY_KEYSTORE_BASE64"; exit 1; }
          test -n "$FRESHLY_KEYSTORE_PASSWORD" || { echo "Missing GitHub secret: FRESHLY_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$FRESHLY_KEY_ALIAS" || { echo "Missing GitHub secret: FRESHLY_KEY_ALIAS"; exit 1; }
          test -n "$FRESHLY_KEY_PASSWORD" || { echo "Missing GitHub secret: FRESHLY_KEY_PASSWORD"; exit 1; }
          echo "$FRESHLY_KEYSTORE_BASE64" | base64 --decode > freshly-upload-key.jks
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle")
          s = p.read_text()
          if "FRESHLY_PERMANENT_SIGNING" in s:
              raise SystemExit("Permanent signing config already exists; refusing to duplicate it.")
          block = """
          // FRESHLY_PERMANENT_SIGNING
          android {
              signingConfigs {
                  freshlyPermanent {
                      storeFile rootProject.file("freshly-upload-key.jks")
                      storePassword System.getenv("FRESHLY_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("FRESHLY_KEY_ALIAS")
                      keyPassword System.getenv("FRESHLY_KEY_PASSWORD")
                  }
              }
              buildTypes {
                  debug {
                      signingConfig signingConfigs.freshlyPermanent
                  }
              }
          }
          """
          p.write_text(s + "\n" + block)
          print("Permanent signing configuration installed.")
          PY
      - name: Build debug APK
        env:
          FRESHLY_KEYSTORE_PASSWORD: ${{ secrets.FRESHLY_KEYSTORE_PASSWORD }}
          FRESHLY_KEY_ALIAS: ${{ secrets.FRESHLY_KEY_ALIAS }}
          FRESHLY_KEY_PASSWORD: ${{ secrets.FRESHLY_KEY_PASSWORD }}
        run: gradle assembleDebug --stacktrace --info
      - name: Prepare complete delivery package
        run: |
          mkdir -p delivery/Android-Project
          # Package the exact patched source tree used to build this APK, not the older input ZIP.
          cp -a settings.gradle build.gradle gradle.properties .github delivery/Android-Project/
          mkdir -p delivery/Android-Project/app
          cp app/build.gradle delivery/Android-Project/app/
          cp -a app/src delivery/Android-Project/app/
          cp README_AR.md delivery/Android-Project/README_AR.md
          cp cashier.html menu.html README_AR.md delivery/
          cp app/build/outputs/apk/debug/app-debug.apk delivery/FRESHLY.apk
          cp app/src/main/assets/freshly-logo.png delivery/freshly-logo.png
          zip -qr FRESHLY-FINAL-PACKAGE.zip delivery
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FRESHLY-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload standalone HTML files
        uses: actions/upload-artifact@v4
        with:
          name: FRESHLY-HTML-FILES
          path: |
            cashier.html
            menu.html
          if-no-files-found: error
      - name: Upload complete project ZIP
        uses: actions/upload-artifact@v4
        with:
          name: FRESHLY-FINAL-PACKAGE
          path: FRESHLY-FINAL-PACKAGE.zip
          if-no-files-found: error
