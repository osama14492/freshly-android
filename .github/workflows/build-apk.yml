name: Build FRESHLY APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'FRESHLY_ANDROID_UPLOAD-1.zip'
      - '.github/workflows/build-apk.yml'
      - 'cashier.html'
      - 'menu.html'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Extract Android project
        run: unzip -o FRESHLY_ANDROID_UPLOAD-1.zip -d .
      - name: Use current POS and menu source files
        run: |
          test -f app/src/main/assets/home.html
          test -f app/src/main/assets/freshly-logo.png
          cp cashier.html app/src/main/assets/cashier.html
          cp menu.html app/src/main/assets/menu.html
          # Restore the original, item-matched FRESHLY menu photos from the menu repository.
          git clone --depth 1 https://github.com/osama14492/FRESHLY-MENU-.git /tmp/freshly-menu
          mkdir -p app/src/main/assets/images
          cp /tmp/freshly-menu/images/*.webp app/src/main/assets/images/
          # Verify every built-in menu item points to an image packaged in this APK.
          python3 - <<'PY'
          import json
          from pathlib import Path
          source = Path("app/src/main/assets/menu.html").read_text()
          marker = "const INITIAL_MENU_DATA = "
          start = source.index(marker) + len(marker)
          end = source.index(";\n", start)
          data = json.loads(source[start:end])
          missing = [item["image"] for item in data["items"]
                     if item.get("image", "").startswith("images/")
                     and not (Path("app/src/main/assets") / item["image"]).is_file()]
          if missing:
              raise SystemExit("Missing original menu images: " + ", ".join(missing))
          print(f"Verified {len(data['items'])} menu items; all local image paths exist.")
          PY
          cp app/src/main/assets/freshly-logo.png app/src/main/assets/images/freshly_logo.png
          echo '--- packaged web assets ---'
          ls -lah app/src/main/assets
          ls -lah app/src/main/assets/images
      - name: Align Java and Kotlin JVM targets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle")
          s = p.read_text()
          needle = "android {"
          addition = """android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          """
          if needle not in s:
              raise SystemExit("android block not found in app/build.gradle")
          s = s.replace(needle, addition, 1)
          p.write_text(s)
          PY
          echo '--- patched app/build.gradle ---'
          cat app/build.gradle
      - name: Inspect Android project
        run: |
          pwd
          ls -la
          find app -maxdepth 4 -type f | sort
          echo '--- settings.gradle ---'
          cat settings.gradle
          echo '--- root build.gradle ---'
          cat build.gradle
          echo '--- app/build.gradle ---'
          cat app/build.gradle
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          dependency-graph: disabled
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace --info
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FRESHLY-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
