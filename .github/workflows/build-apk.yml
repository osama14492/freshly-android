name: Build FRESHLY APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'FRESHLY_ANDROID_UPLOAD-1.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Extract Android project
        run: unzip -o FRESHLY_ANDROID_UPLOAD-1.zip -d .
      - name: Align Java and Kotlin JVM targets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle")
          s = p.read_text()
          needle = "android {"
          addition = """android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          """
          if needle not in s:
              raise SystemExit("android block not found in app/build.gradle")
          s = s.replace(needle, addition, 1)
          p.write_text(s)
          PY
          echo '--- patched app/build.gradle ---'
          cat app/build.gradle
      - name: Inspect Android project
        run: |
          pwd
          ls -la
          find app -maxdepth 4 -type f | sort
          echo '--- settings.gradle ---'
          cat settings.gradle
          echo '--- root build.gradle ---'
          cat build.gradle
          echo '--- app/build.gradle ---'
          cat app/build.gradle
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          dependency-graph: disabled
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace --info
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FRESHLY-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
