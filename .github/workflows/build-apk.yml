name: Build FRESHLY APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'FRESHLY_ANDROID/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        working-directory: FRESHLY_ANDROID
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FRESHLY-APK
          path: FRESHLY_ANDROID/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
